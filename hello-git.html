<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello, Git</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f8f8f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #444;
    }

    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06);
      padding: 60px 48px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }

    .card h1 {
      font-size: 2rem;
      font-weight: 300;
      color: #333;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .card h1 span {
      color: #f05133;
      font-weight: 500;
    }

    .card .divider {
      width: 40px;
      height: 2px;
      background: #f05133;
      margin: 20px auto 24px;
    }

    .card p {
      font-size: 1rem;
      line-height: 1.8;
      color: #666;
      margin-bottom: 8px;
    }

    .card .date {
      margin-top: 32px;
      font-size: 0.85rem;
      color: #aaa;
    }

    .card .branch {
      display: inline-block;
      margin-top: 28px;
      font-size: 2rem;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, <span>Git</span></h1>
    <div class="divider"></div>
    <p>这是我第一次使用 Git 管理文件。</p>
    <p>从今天开始，每一个改动都会被记录。加油</p>
    <div class="branch">🌱</div>
    <div class="date">2026 年 7 月 26 日</div>
  </div>
</body>
</html>
